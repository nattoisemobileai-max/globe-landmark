<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landmark Guesser Game</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20n6a9Kx6I5TDwoSnFmfJ+4uB/SEi3sO2rp57J8uR4A="
        crossorigin=""></script>

    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; background-color: #f4f4f4; }
        #map { height: 600px; width: 80%; border: 3px solid #333; margin-top: 20px; }
        #game-container { padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 80%; max-width: 800px; margin-top: 20px; }
        #setup-screen { text-align: center; }
        .cartoon-face { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; cursor: pointer; margin: 5px; border: 2px solid transparent; transition: border-color 0.2s; }
        .cartoon-face.selected { border-color: #007bff; box-shadow: 0 0 5px #007bff; }
        button, input[type="text"] { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; cursor: pointer; border: none; }
        #bingo-message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 50px; background: rgba(0, 123, 255, 0.9); color: white; border-radius: 15px; font-size: 3em; z-index: 1000; display: none; text-align: center;}
    </style>
</head>
<body>

    <div id="game-container">
        <h1>🌍 Landmark Guesser</h1>
        
        <div id="setup-screen">
            <h2>Step 1: Get Started</h2>
            <input type="text" id="username-input" placeholder="Enter Username" required>
            <h3>Select a Cartoon Face</h3>
            <div id="face-selection">
                <span class="cartoon-face" data-face="😀" onclick="selectFace(this)">😀</span>
                <span class="cartoon-face" data-face="😎" onclick="selectFace(this)">😎</span>
                <span class="cartoon-face" data-face="🤖" onclick="selectFace(this)">🤖</span>
            </div>
            <button onclick="startGame()">Start Game</button>
        </div>

        <div id="game-screen" style="display: none;">
            <p>Welcome, <strong id="display-username"></strong>! You have selected face: <span id="display-face"></span></p>
            <hr>
            <h2>Step 2: Guess the Landmark!</h2>
            <input type="text" id="landmark-input" placeholder="Enter landmark name (e.g., Eiffel Tower)">
            <button onclick="checkGuess()">Submit Guess</button>
            <div id="result-message" style="margin-top: 15px; font-weight: bold;"></div>
        </div>
    </div>

    <div id="map"></div>
    
    <div id="bingo-message">BINGO! You found it!</div>

    <script src="game.js"></script>

</body>
</html>
